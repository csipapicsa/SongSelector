# User guide (mkdocs.yml, userdocs/) -> https://csipapicsa.github.io/SongSelector/
# Pull requests: build with --strict (broken links, missing pages and nav errors fail).
# main: build and publish to GitHub Pages (repo Settings -> Pages -> Source: GitHub Actions).
name: Docs

on:
  pull_request:
    paths: ['userdocs/**', 'overrides/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['userdocs/**', 'overrides/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false  # never cut a deployment short

env:
  NO_MKDOCS_2_WARNING: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
