name: Release

on:
  # A version tag (v1.2.3) builds, verifies and publishes a GitHub Release.
  push:
    tags: ["v*.*.*"]
  # A PR that changes the packaging runs the same build and verification as a dry run (nothing is published),
  # so a broken build is found before a release, not during one.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/setup.ps1"
      - "scripts/build.ps1"
      - "scripts/verify_release.ps1"
      - "scripts/update_qt_msvc_runtime.ps1"
      - "scripts/release_notes.ps1"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release half-way

jobs:
  build:
    # Read-only: this job runs third-party code (pip packages, PyInstaller), so it gets no write access.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history: the tag-on-main check needs origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Release tag must match the code and be on main
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $code = (Select-String -LiteralPath src/traktor_key_calculator/__init__.py -Pattern "__version__ = '([^']+)'").Matches[0].Groups[1].Value
          if ("v$code" -ne $env:TAG) { throw "Tag $env:TAG does not match __version__ = '$code' in the code." }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:TAG points to a commit that is not on main (not reviewed through a PR)." }
          "Releasing version $code from main."

      # The same scripts as on a developer's PC: setup.ps1 reuses an existing .venv, installs the pinned
      # dependencies and replaces PyQt5's outdated MSVC runtime (see update_qt_msvc_runtime.ps1).
      - name: Set up the build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\scripts\setup.ps1

      - name: Tests
        shell: pwsh
        run: .\scripts\test.ps1 -m "not local_data"

      - name: Build the exe
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Verify the exe (self-check inside the exe, then a real window)
        shell: pwsh
        run: .\scripts\verify_release.ps1

      - name: Checksum and release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          $exe = Get-ChildItem dist -Filter 'TraktorKeyCalculator-*.exe' | Select-Object -First 1
          Copy-Item -LiteralPath $exe.FullName -Destination release
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -LiteralPath release/SHA256SUMS.txt -Value "$hash  $($exe.Name)" -Encoding ascii
          $version = (Select-String -LiteralPath src/traktor_key_calculator/__init__.py -Pattern "__version__ = '([^']+)'").Matches[0].Groups[1].Value
          if ($env:IS_RELEASE -eq 'true') {
            # A release must have its own changelog section; the script fails if it is missing.
            .\scripts\release_notes.ps1 -Version $version -Out release/notes.md
          } else {
            # Dry run: the next version's notes are usually still under Unreleased.
            try { .\scripts\release_notes.ps1 -Version Unreleased -Out release/notes.md }
            catch { .\scripts\release_notes.ps1 -Version $version -Out release/notes.md }
          }
          Get-ChildItem release | Format-Table Name, Length

      # Hand the files to the publish job. The exe that is published is the one verified above.
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          retention-days: 7

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # Write access only here, only for releases, and this job runs no third-party code.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.exe release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "SongSelector ${TAG#v}" \
            --notes-file release/notes.md \
            --verify-tag
