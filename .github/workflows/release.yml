name: Release

on:
  # A version tag (v1.2.3) builds, verifies and publishes a GitHub Release: the Windows exe and the Linux AppImage.
  push:
    tags: ["v*.*.*"]
  # A PR that changes the packaging runs the same build and verification as a dry run (nothing is published),
  # so a broken build is found before a release, not during one.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/setup.ps1"
      - "scripts/build.ps1"
      - "scripts/verify_release.ps1"
      - "scripts/update_qt_msvc_runtime.ps1"
      - "scripts/release_notes.ps1"
      - "scripts/build_linux.sh"
      - "scripts/verify_release.sh"
      - "scripts/x11_window.py"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release half-way

jobs:
  build:
    # Windows. Read-only: this job runs third-party code (pip packages, PyInstaller), so it gets no write access.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history: the tag-on-main check needs origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Release tag must match the code and be on main
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $code = (Select-String -LiteralPath src/songselector/__init__.py -Pattern "__version__ = '([^']+)'").Matches[0].Groups[1].Value
          if ("v$code" -ne $env:TAG) { throw "Tag $env:TAG does not match __version__ = '$code' in the code." }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:TAG points to a commit that is not on main (not reviewed through a PR)." }
          "Releasing version $code from main."

      # The same scripts as on a developer's PC: setup.ps1 reuses an existing .venv, installs the pinned
      # dependencies and replaces PyQt5's outdated MSVC runtime (see update_qt_msvc_runtime.ps1).
      - name: Set up the build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\scripts\setup.ps1

      - name: Tests
        shell: pwsh
        run: .\scripts\test.ps1 -m "not local_data"

      - name: Build the exe
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Verify the exe (self-check inside the exe, then a real window)
        shell: pwsh
        run: .\scripts\verify_release.ps1

      - name: Release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          $exe = Get-ChildItem dist -Filter 'SongSelector-*.exe' | Select-Object -First 1
          Copy-Item -LiteralPath $exe.FullName -Destination release
          $version = (Select-String -LiteralPath src/songselector/__init__.py -Pattern "__version__ = '([^']+)'").Matches[0].Groups[1].Value
          if ($env:IS_RELEASE -eq 'true') {
            # A release must have its own changelog section; the script fails if it is missing.
            .\scripts\release_notes.ps1 -Version $version -Out release/notes.md
          } else {
            # Dry run: the next version's notes are usually still under Unreleased.
            try { .\scripts\release_notes.ps1 -Version Unreleased -Out release/notes.md }
            catch { .\scripts\release_notes.ps1 -Version $version -Out release/notes.md }
          }
          Get-ChildItem release | Format-Table Name, Length

      # Hand the files to the publish job. The exe that is published is the one verified above.
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/
          retention-days: 7

  build-linux:
    # Linux: the AppImage. Read-only, like the Windows build. ubuntu-22.04 has the oldest glibc on GitHub's runners;
    # the bundled libraries need at least the glibc they were built against, so this one starts on more systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Release tag must match the code
        if: env.IS_RELEASE == 'true'
        run: |
          code="$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" src/songselector/__init__.py)"
          [ "v$code" = "$TAG" ] || { echo "Tag $TAG does not match __version__ = '$code' in the code." >&2; exit 1; }

      # Qt's system libraries for its xcb platform (the real window), and Xvfb, a display without a screen.
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends xvfb xauth libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-xkb1

      - name: Set up the build environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q -r requirements-dev.txt

      - name: Tests
        run: .venv/bin/python -m pytest -m "not local_data"

      - name: Build the AppImage
        run: scripts/build_linux.sh

      - name: Verify the AppImage (self-check inside it, then a real window on Xvfb)
        run: xvfb-run -a scripts/verify_release.sh

      - run: |
          mkdir release
          cp dist/SongSelector-*-x86_64.AppImage release/
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/
          retention-days: 7

  publish:
    needs: [build, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    # Write access only here, only for releases, and this job runs no third-party code (only GitHub's own actions).
    # The provenance attestation is made here, not in the build jobs: they run pip packages and PyInstaller, and
    # code that can mint an attestation could vouch for a file it tampered with.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write       # signing the attestation (Sigstore, through GitHub's OIDC token)
      attestations: write   # storing it on the repo's Attestations page
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      # One checksum file for both downloads (the files verified in the build jobs).
      - name: Checksums
        run: |
          cd release
          sha256sum SongSelector-* | tee SHA256SUMS.txt
      # Signed statement: these exact files were built by this workflow, from this commit of this repository.
      # Anyone can check it: gh attestation verify <file> --repo csipapicsa/SongSelector
      - name: Build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/SongSelector-*
      - name: How to verify, in the release notes
        run: |
          cat >> release/notes.md <<'EOF'

          ### Verify this download

          - **Checksum:** compare the file's SHA-256 with `SHA256SUMS.txt` (Windows PowerShell: `Get-FileHash .\SongSelector-*.exe`).
          - **Built from this repository:** `gh attestation verify <file> --repo csipapicsa/SongSelector` checks GitHub's signed build provenance: the file was built by this repository's release workflow from the tagged commit.
          - The exe is not code-signed, so Windows shows *Windows protected your PC* (blue): *More info → Run anyway*. More in [Is it safe?](https://csipapicsa.github.io/SongSelector/safety/) and [SECURITY.md](https://github.com/csipapicsa/SongSelector/blob/main/SECURITY.md).
          EOF
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/SongSelector-* release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "SongSelector ${TAG#v}" \
            --notes-file release/notes.md \
            --verify-tag

  virustotal:
    # After publishing: upload each download to VirusTotal and link the results in the release notes, so anyone can
    # see what the antivirus engines say. Skipped without the VIRUSTOTAL_API_KEY secret; a failure here never
    # undoes the release. Only curl and gh: no third-party code next to the API key.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: write   # editing the release notes
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Upload to VirusTotal and link the results
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::notice::No VIRUSTOTAL_API_KEY secret: no antivirus scan."
            exit 0
          fi
          : > links.md
          for file in release/SongSelector-*; do
            # Files over 32 MB go to a one-time upload URL (v3 API).
            upload=$(curl -sSf -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
            curl -sSf -H "x-apikey: $VT_API_KEY" -F "file=@$file" "$upload" > /dev/null
            sum=$(sha256sum "$file" | cut -d' ' -f1)
            echo "- [$(basename "$file")](https://www.virustotal.com/gui/file/$sum)" >> links.md
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "### Antivirus scan"
            echo
            echo "Each download was uploaded to VirusTotal when it was published (results appear there after a few minutes):"
            echo
            cat links.md
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
