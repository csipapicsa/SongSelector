name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, even without code changes: new vulnerabilities are published for dependencies we already pin,
  # and the runner images change under us.
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:      # "Run workflow" button in the Actions tab

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

# A new push to a PR cancels that PR's older, now-outdated run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # What does this PR touch? App code runs lint, audit and test; research code (research/, not part of the app) only
    # lint; documentation none of them.
    # Jobs skipped by an `if:` count as passed for required checks; skipping the whole workflow (paths-ignore)
    # would leave the required checks waiting forever. This job is a required check itself: if it fails,
    # the jobs after it are skipped, and without that requirement a skip would let the PR through.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      research: ${{ steps.diff.outputs.research }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2  # the PR's merge preview and its parents
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Pushes to main, the weekly run and manual runs always run everything.
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "research=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # For a PR, HEAD is GitHub's merge preview; its first parent is the target branch.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$changed"
          # Research scripts and notebooks are linted like the app; the rest of research/ (notes, results) is not code.
          if printf '%s\n' "$changed" | grep -qE '^research/.*\.(py|ipynb)$'; then
            echo "research=true" >> "$GITHUB_OUTPUT"
          else
            echo "research=false" >> "$GITHUB_OUTPUT"
          fi
          # Fail-safe: only docs/, research/, *.md and LICENSE are outside the app; anything else (or an empty diff)
          # is app code.
          if printf '%s\n' "$changed" | grep -qvE '^docs/|^research/|\.md$|^LICENSE$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No app code changed: audit and test are skipped."
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.research == 'true'
    # Linting doesn't depend on the OS, and Linux runners start faster than Windows ones.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Install only ruff, at the version pinned in requirements-dev.txt (one source of truth).
      - run: python -m pip install "$(grep -oE '^ruff==[^ ]+' requirements-dev.txt)"
      # "github" format turns findings into annotations on the PR's changed lines.
      - run: python -m ruff check --output-format=github src tests research

  secret-scan:
    # Always runs: a secret pasted into a Markdown file is still a leak.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"  # same version as used locally
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the whole history, not just the latest commit: a secret stays in history once committed
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
      # --redact: CI logs of a public repo are public, so a found secret must not be printed in them.
      - run: ./gitleaks git --redact --verbose .

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # pip-audit resolves the full dependency tree; onnxruntime-directml only has Windows wheels.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "$(grep -oE '^pip-audit==[^ ]+' requirements-dev.txt)"
        shell: bash
      - run: python -m pip_audit -r requirements.txt -r requirements-dev.txt --progress-spinner off

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.os }})
    # Both systems the releases are built for. ubuntu-22.04, not -latest: the Linux release is built there (the
    # oldest glibc still on GitHub's runners, so the AppImage also starts on older distributions).
    strategy:
      fail-fast: false  # a failure on one system should not hide the result of the other
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # Qt's own system libraries (the tests run Qt offscreen; the xcb ones are for the real window).
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-xkb1
      - run: python -m pip install -r requirements-dev.txt
      # local_data tests need the developer's real library (not in the repo); see pyproject.toml.
      - run: python -m pytest -m "not local_data"

  test:
    # The required check (the repository's ruleset names "test"; the matrix jobs above are named per system). Passes
    # when the tests passed on every system, or were skipped because the PR changes no app code. Fails
    # otherwise, also when `changes` failed: then the code output is empty.
    needs: [changes, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.tests.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "Tests: $RESULT (code changed: ${CODE:-unknown})"
          [ "$RESULT" = success ] || { [ "$RESULT" = skipped ] && [ "$CODE" = false ]; }
