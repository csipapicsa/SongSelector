name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, even without code changes: new vulnerabilities are published for dependencies we already pin,
  # and the runner images change under us.
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:      # "Run workflow" button in the Actions tab

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

# A new push to a PR cancels that PR's older, now-outdated run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Linting doesn't depend on the OS, and Linux runners start faster than Windows ones.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Install only ruff, at the version pinned in requirements-dev.txt (one source of truth).
      - run: python -m pip install "$(grep -oE '^ruff==[^ ]+' requirements-dev.txt)"
      # "github" format turns findings into annotations on the PR's changed lines.
      - run: python -m ruff check --output-format=github src tests

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"  # same version as used locally
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the whole history, not just the latest commit: a secret stays in history once committed
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
      # --redact: CI logs of a public repo are public, so a found secret must not be printed in them.
      - run: ./gitleaks git --redact --verbose .

  audit:
    # pip-audit resolves the full dependency tree; onnxruntime-directml only has Windows wheels.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "$(grep -oE '^pip-audit==[^ ]+' requirements-dev.txt)"
        shell: bash
      - run: python -m pip_audit -r requirements.txt -r requirements-dev.txt --progress-spinner off

  test:
    # The app is Windows-only (DirectML, Windows paths, the exe build), so the tests run on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      # local_data tests need the developer's real library (not in the repo); see pyproject.toml.
      - run: python -m pytest -m "not local_data"
