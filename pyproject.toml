[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "songselector"
dynamic = ["version"]
description = "Desktop DJ library tool: tempo-aware harmonic keys, audio-similarity search over neural embeddings, Traktor and Rekordbox integration."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Gergo Gyori" }]
# Exact, verified versions live in requirements.txt / requirements-dev.txt.
dependencies = [
    "PyQt5>=5.15,<5.16",
    "mutagen>=1.47",
    "pandas>=2.3,<3",
    "onnxruntime-directml>=1.22",
    "soundfile>=0.13",
    "soxr>=0.5",
    "tokenizers>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.16,<7"]

[project.gui-scripts]
songselector = "songselector.app:main"

[tool.setuptools.dynamic]
version = { attr = "songselector.__version__" }

[tool.setuptools.package-data]
songselector = ["ui/splash.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120          # only used to wrap long import lines; E501 (line too long) is not enforced

[tool.ruff.lint]
# Listed explicitly: ruff's default rule set changes between releases, so relying on it would let a
# ruff upgrade turn CI red without any code change. The version is pinned in requirements-dev.txt.
select = [
    "E4", "E7", "E9",  # pycodestyle: statements, imports, syntax errors
    "F",               # pyflakes: unused/undefined names, redefinitions
    "B",               # flake8-bugbear: likely bugs (loop-variable closures, broad assertRaises, ...)
    "I",               # isort: import order
    "UP",              # pyupgrade: modern syntax for the target Python
]
ignore = [
    "B905",  # zip() without strict=: the zipped sequences are built together; strict= would only add noise
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    # Acceptance tests against the developer's real Traktor collection and audio files. They are not in the repo
    # (personal library, commercial tracks), so CI deselects them; the same logic is covered by generated fixtures.
    "local_data: needs files outside the repo (real library, real MP3s); deselected in CI",
]
